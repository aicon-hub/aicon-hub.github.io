name: Publish AiCoN to Telegram
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check, publish, or edit an existing channel message
        required: true
        default: check
        type: choice
        options: [check, publish, edit]
      message_id:
        description: Existing channel message ID, required for edit (never deletes or reposts)
        required: false
      post_id:
        description: Stable unique operation ID, reused on retries; use a new ID for each edit
        required: false
      text:
        description: Final post text with optional single-star bold and underscore italic
        required: false
      photo_url:
        description: Optional public AiCoN PNG or JPEG poster URL
        required: false
      photo_base64:
        description: Optional JPEG or PNG as base64 instead of a URL
        required: false
      article_url:
        description: Live AiCoN guide URL, required for article posts; pass none or leave empty for a Telegram-only post
        required: false
permissions:
  contents: write
concurrency:
  group: telegram-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify or publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import os,json,sys,hashlib,html,re,urllib.request,urllib.error,datetime,base64
          
          def request(url,payload=None,headers=None):
              req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),headers={'Content-Type':'application/json',**(headers or {})},method=('PUT' if headers and payload is not None else None))
              try:
                  with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  raise RuntimeError('Remote HTTP error '+str(e.code)) from None
              except Exception:raise RuntimeError('Transport outcome uncertain; reconcile before retry') from None
          
          def tg(method,data):
              media_upload=method=='editMessageMedia' and data.get('media',{}).get('media')=='attach://poster'
              if (method=='sendPhoto' and data.get('photo')=='upload') or media_upload:
                  raw=base64.b64decode(json.load(open(os.environ['GITHUB_EVENT_PATH']))['inputs']['photo_base64'],validate=True)
                  boundary='AiCoNMultipartBoundary'
                  body=b''
                  for k,v in data.items():
                      if k=='photo':continue
                      if isinstance(v,dict):v=json.dumps(v)
                      body+=('--'+boundary+'\r\nContent-Disposition: form-data; name="'+k+'"\r\n\r\n'+str(v)+'\r\n').encode()
                  body+=('--'+boundary+'\r\nContent-Disposition: form-data; name="'+('poster' if media_upload else 'photo')+'"; filename="poster.jpg"\r\nContent-Type: image/jpeg\r\n\r\n').encode()+raw+('\r\n--'+boundary+'--\r\n').encode()
                  req=urllib.request.Request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/'+method,data=body,headers={'Content-Type':'multipart/form-data; boundary='+boundary})
                  try:
                      with urllib.request.urlopen(req,timeout=40) as r: reply=json.load(r)
                  except Exception:raise RuntimeError('Photo transport uncertain; inspect before retry') from None
                  if not reply.get('ok'):raise RuntimeError('Telegram rejected poster')
                  return reply['result']
              reply=request('https://api.telegram.org/bot'+os.environ['TELEGRAM_BOT_TOKEN']+'/'+method,data)
              if not reply.get('ok'):raise RuntimeError('Telegram rejected request')
              return reply['result']
          
          def formatted(text):
              # Only AiCoN's established single-star bold and single-underscore italic.
              text=html.escape(text)
              text=re.sub(r'(?<!\w)\*([^*\n]+)\*(?!\w)',r'<b>\1</b>',text)
              text=re.sub(r'(?<!\w)_([^_\n]+)_(?!\w)',r'<i>\1</i>',text)
              return text
          
          def units(text):return len(text.encode('utf-16-le'))//2
          
          def plan(text,photo):
              if not text or units(text)>4096:raise RuntimeError('Post text must fit 1-4096 UTF-16 units')
              if photo and photo!='upload' and (not photo.startswith('https://aicon-hub.github.io/') or not photo.lower().endswith(('.png','.jpg','.jpeg'))):
                  raise RuntimeError('Poster must be a public AiCoN PNG/JPEG URL')
              content=formatted(text)
              if photo and units(text)<=1024:return [('sendPhoto',{'photo':photo,'caption':content,'parse_mode':'HTML'})]
              result=[('sendMessage',{'text':content,'parse_mode':'HTML'})]
              if photo:result.append(('sendPhoto',{'photo':photo}))
              return result
          
          def edit_plan(data):
              mid=data.get('message_id','').strip()
              if not mid.isdigit() or int(mid)<=0:raise RuntimeError('A positive existing message_id is required for edit')
              text=data.get('text','').replace('\\n','\n')
              if not text or units(text)>1024:raise RuntimeError('Edit requires the final full caption, 1-1024 UTF-16 units')
              photo='upload' if data.get('photo_base64') else data.get('photo_url','')
              if data.get('photo_base64') and data.get('photo_url'):raise RuntimeError('Provide only one poster source')
              if photo:
                  plan(text,photo) # Same poster URL restrictions as publish.
                  return [('editMessageMedia',{'message_id':int(mid),'media':{'type':'photo','media':'attach://poster' if photo=='upload' else photo,'caption':formatted(text),'parse_mode':'HTML'}})]
              return [('editMessageCaption',{'message_id':int(mid),'caption':formatted(text),'parse_mode':'HTML'})]

          def verify():
              me=tg('getMe',{})
              if me.get('username','').lower()!='aiconate_bot':raise RuntimeError('Unexpected bot identity')
              chat=tg('getChat',{'chat_id':'@AiCoN4tech'})
              if chat.get('type')!='channel' or chat.get('username','').lower()!='aicon4tech':raise RuntimeError('Unexpected channel identity')
              member=tg('getChatMember',{'chat_id':chat['id'],'user_id':me['id']})
              if member.get('status')!='administrator' or not member.get('can_post_messages'):raise RuntimeError('Bot lacks posting permission')
              return chat['id']
          
          def main():
              event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
              data=event.get('inputs',{})
              mode=data.get('mode','check')
              if mode not in ('check','publish','edit'):raise RuntimeError('Unknown mode')
              if mode=='check':
                  print(json.dumps({'verified_channel_id':verify(),'posting_permission':True}));return
              post_id=data.get('post_id','').strip()
              if not post_id:raise RuntimeError('A stable post_id is required')
              steps=edit_plan(data) if mode=='edit' else plan(data.get('text','').replace('\\n','\n'),'upload' if data.get('photo_base64') else data.get('photo_url',''))
              # Article-first for article posts: require the live guide before any claim or send. Telegram-only posts pass article_url none/empty and skip the URL checks.
              article=data.get('article_url','').strip()
              telegram_only=article=='' or article.lower()=='none'
              if not telegram_only:
                  if not article.startswith('https://aicon-hub.github.io/posts/') or not article.endswith('.html'):raise RuntimeError('A live AiCoN article URL is required (pass none for a Telegram-only post)')
                  try:
                      with urllib.request.urlopen(article,timeout=30) as r:
                          if r.status!=200:raise RuntimeError('Article not live')
                  except Exception:raise RuntimeError('Article availability check failed') from None
              else:article='none'
              chat_id=verify()
              key=hashlib.sha256((('edit:'+post_id) if mode=='edit' else post_id).encode()).hexdigest()
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/telegram-receipts/'+key+'.json'
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
              existing=None
              try:existing=request(url,headers=headers)
              except RuntimeError as e:
                  if str(e)!='Remote HTTP error 404':raise
              if existing:
                  print('Post ID already claimed. No resend. Inspect its receipt and channel.');return
              state={'post_id':post_id,'article_url':article,'status':'claimed','run_id':os.environ['GITHUB_RUN_ID'],'message_ids':[]}
              if mode=='edit':state.update(mode='edit',target_message_id=int(data['message_id']),payload_sha256=hashlib.sha256(json.dumps(steps,sort_keys=True).encode()).hexdigest())
              sha=None
              def save():
                  nonlocal sha
                  body={'message':'Record Telegram publishing state','content':base64.b64encode((json.dumps(state,indent=2)+'\n').encode()).decode(),'branch':'main'}
                  if sha:body['sha']=sha
                  sha=request(url,body,headers)['content']['sha']
              save() # Durable claim BEFORE effect. Failure prevents sending.
              for method,payload in steps:
                  result=tg(method,{'chat_id':chat_id,**payload})
                  if mode=='edit' and result.get('message_id')!=int(data['message_id']):raise RuntimeError('Unexpected edited message ID; reconcile receipt')
                  state['message_ids'].append(result['message_id'])
                  state['status']='partial'
                  save() # Do not proceed to next part unless first receipt persisted.
              state['status']='edited' if mode=='edit' else 'sent';save()
              print(json.dumps({'channel_id':chat_id,'message_ids':state['message_ids'],'post_id':post_id}))
          if __name__=='__main__':
              try:main()
              except Exception as e:
                  # Do not print tracebacks, request URLs, or arbitrary remote content.
                  print('Publisher stopped: '+str(e) if isinstance(e,RuntimeError) else 'Publisher stopped: check inputs or secret configuration',file=sys.stderr)
                  sys.exit(1)
          PYCODE
