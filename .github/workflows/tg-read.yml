name: Telegram group reader
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: telegram-group-reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if git fetch origin tg-inbox --depth=1 2>/dev/null; then
            git checkout -B tg-inbox FETCH_HEAD
          else
            git checkout --orphan tg-inbox
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > reader.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIECTCCAnGgAwIBAgIUNpvUc5ov5j8M7hu1nIeXRPLogsgwDQYJKoZIhvcNAQEL
