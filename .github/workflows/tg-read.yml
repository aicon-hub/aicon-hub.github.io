name: Telegram group reader
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: telegram-group-reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if git fetch origin tg-inbox --depth=1 2>/dev/null; then
            git checkout -B tg-inbox FETCH_HEAD
          else
            git checkout --orphan tg-inbox
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > reader.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIECTCCAnGgAwIBAgIUChJNYQuuNSo29rmA7SwoNCoP0HkwDQYJKoZIhvcNAQEL
          BQAwFDESMBAGA1UEAwwJdGctcmVhZGVyMB4XDTI2MTAyMTA0MDA1NFoXDTM2MTAx
          ODA0MDA1NFowFDESMBAGA1UEAwwJdGctcmVhZGVyMIIBojANBgkqhkiG9w0BAQEF
          AAOCAY8AMIIBigKCAYEAnFRaWgDHndwnTC4i6MoRGzmZSppZuhB0+RHhSRrHtwNE
          L80s4046XhJzyiIYcp2Er5460JILoDJ4jOCMiiJDeV/1z7gn7GCPscWTEoJoGYIB
          a4sBgRocJa3u4JycNcIFx2xKsO0OYXgVFYBVfa/Bx2wQRFEfRAy+RN3eDpMmO7dq
          ZN3HrUz30WTJC+v+Q8+5FTDZk/B93jVJBLrL/dVrIQHlACXiPsyXrWAsCWZuMfqQ
          +bi07QGFi5d7uyxf1hKh1zxLy7BbLSxZDzFLPf+LPmj5s1ea+fu9h1WdH+SlmwS2
          dBgXp88FToSfv3ud4o7341ifkIdW98XJxjRZCV+M/zHqWhO3Fme41PXLcdrHdLpX
          VXsJs4KeM5LBR+K8l5yTOziklEXq++SpCAsQo9yxn/RcCYSOOY9s4YzVc7wC33wR
          E9ZQ0DaYhwPSbiSKjwhqaq5ZDHjrqK065CXtz6gJRHHB0drbdVK6HoNF+a0bUd4k
          t2tyi93hDk/jGBYlag0pAgMBAAGjUzBRMB0GA1UdDgQWBBR8P1M+/oaKfDuCJmdR
          OeuYJKGDlzAfBgNVHSMEGDAWgBR8P1M+/oaKfDuCJmdROeuYJKGDlzAPBgNVHRMB
          Af8EBTADAQH/MA0GCSqGSIb3DQEBCwUAA4IBgQB8UixB3E44XvsR0MY0qyC6XScK
          P9Fvt1r8DcbsF6QGo1pTyN/MmhRgm/SxgFGisTNZG8m94fSzyPkXXe4BlSZzNe41
