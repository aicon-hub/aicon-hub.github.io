          QlaDhnajhoyPIgv2TKppB1gGQDfUeAvF0SJACyk=
          -----END CERTIFICATE-----
          CERT
          cat > reader.py <<'PYCODE'
          import os, json, subprocess, sys, time, urllib.request, urllib.error, urllib.parse
          T = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          START = time.time()
          class Stop(Exception): pass
          def tg(method, **params):
              q = urllib.parse.urlencode({k: (json.dumps(v) if isinstance(v, (list, dict)) else v) for k, v in params.items()})
              try:
                  with urllib.request.urlopen('https://api.telegram.org/bot' + T + '/' + method + ('?' + q if q else ''), timeout=45) as r:
                      d = json.load(r)
              except urllib.error.HTTPError as e:
                  print('telegram http error', e.code); raise Stop() if e.code in (401, 404, 409) else RuntimeError()
              except Exception:
                  print('transport error'); raise RuntimeError()
              if not d.get('ok'):
                  print('telegram rejected', method); raise Stop()
              return d['result']
          def sh(*a):
              return subprocess.run(a, capture_output=True)
          if not T:
              print('missing secret'); sys.exit(0)
          try:
              wh = tg('getWebhookInfo')
          except (Stop, RuntimeError):
              sys.exit(0)
          if wh.get('url'):
              print('webhook is set; reader stands down, nothing changed'); sys.exit(0)
          st = {}
          try: st = json.load(open('inbox/state.json'))
          except Exception: pass
          off = st.get('offset')
          n = 0
          os.makedirs('inbox', exist_ok=True)
          if not os.path.exists('inbox/active.txt'): open('inbox/active.txt','w').write(str(int(time.time())))
          while time.time() - START < 285:
              args = dict(limit=100, timeout=25, allowed_updates=['message', 'edited_message', 'my_chat_member'])
              if off: args['offset'] = off
              try:
                  ups = tg('getUpdates', **args)
              except Stop:
                  break
              except RuntimeError:
                  time.sleep(5); continue
              if not ups: continue
              first, last = ups[0]['update_id'], ups[-1]['update_id']
              p = subprocess.run(['openssl', 'cms', '-encrypt', '-aes-256-cbc', '-outform', 'PEM', 'reader.pem'],
                                 input=json.dumps(ups).encode(), capture_output=True)
              if p.returncode: print('encrypt failed'); break
              os.makedirs('inbox', exist_ok=True)
              open('inbox/batch-%d-%d.cms' % (first, last), 'wb').write(p.stdout)
              json.dump({'offset': last + 1}, open('inbox/state.json', 'w'))
              open('inbox/active.txt','w').write(str(int(time.time())))
              sh('git', 'add', 'inbox')
              c = sh('git', 'commit', '-m', 'inbox')
              pu = sh('git', 'push', 'origin', 'tg-inbox')
              if pu.returncode:
                  sh('git', 'pull', '--rebase', 'origin', 'tg-inbox'); pu = sh('git', 'push', 'origin', 'tg-inbox')
              if pu.returncode: print('push failed'); break
              off = last + 1; n += 1
              print('stored batch', first, last)
          print('done, batches:', n)
          sh('git', 'add', 'inbox'); sh('git', 'commit', '-m', 'inbox'); sh('git', 'push', 'origin', 'tg-inbox')
          PYCODE
          python3 reader.py
      - name: Chain next long-poll while the group is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s); a=$(cat inbox/active.txt 2>/dev/null || echo $now)
          if [ $((now-a)) -lt 315360000 ]; then gh workflow run tg-read.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
