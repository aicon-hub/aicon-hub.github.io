name: Telegram group reader
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: telegram-group-reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if git fetch origin tg-inbox --depth=1 2>/dev/null; then
            git checkout -B tg-inbox FETCH_HEAD
          else
            git checkout --orphan tg-inbox
            git rm -rf . >/dev/null 2>&1 || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > reader.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIECTCCAnGgAwIBAgIUUB38xaB2MJP2wgjD2VOgoQZgjQswDQYJKoZIhvcNAQEL
          BQAwFDESMBAGA1UEAwwJdGctcmVhZGVyMB4XDTI2MTAyMzAzNTk1NFoXDTM2MTAy
          MDAzNTk1NFowFDESMBAGA1UEAwwJdGctcmVhZGVyMIIBojANBgkqhkiG9w0BAQEF
          AAOCAY8AMIIBigKCAYEApHR1/WQlVG3NNHbRpVr6COnuiRQondBT63gZF0Hu9HUx
          P8/RnWbD+vS3/A3UIHNmWmC2qHBCkIfwc5PezpH5QOqq1WAvo6txOLnru8WVy3We
          X/0Wnf7Xt0x8srvMgl9XBm+YC73tuU/j0bQu4uhNezTRBaoZlrG4MS/aasg+S+HQ
          mvOajC7BPjJ1BDp01Lpr3Q7z9MERyJh5Yk/+dfFzP3wF8SXW8r+fME1g302dgcTV
          SzVskZ1Lg3mymoieotJiiMSiFXZghmdXU7Wvd1silDtq3ql5sjZnKXP1JCXRP5I7
          zYff9hBwLSd+tR5U+r8uFP9L3YhiupWlcnKHdqlQSjI/2CuShnBhoO5ZX2XR10Ip
          H8D4kOz7qagVYNDRyoRwb/lcHjnu3Xy9cRsLm8AGkSjFBMAEg9dkXktb6Tf/jWay
          Xa+tGaTat4b8PeaxZY//TBXnJ+xr4x9h5W6ciLSjGO7wfrJGAM+m4UeQuzUyaIPi
          gWZVXN/SWdobdkMesPiTAgMBAAGjUzBRMB0GA1UdDgQWBBT2xCG3AxfwG+WQMVjH
          e7V+FT3j4DAfBgNVHSMEGDAWgBT2xCG3AxfwG+WQMVjHe7V+FT3j4DAPBgNVHRMB
