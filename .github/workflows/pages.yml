name: Build and deploy AiCoN Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-build.txt
      - name: Load approved preview fonts
        run: |
          mkdir -p ~/.local/share/fonts
          curl --fail --location 'https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLEj6V1s.ttf' -o ~/.local/share/fonts/Poppins-SemiBold.ttf
          curl --fail --location 'https://fonts.gstatic.com/s/poppins/v24/pxiEyp8kv8JHgFVrFJA.ttf' -o ~/.local/share/fonts/Poppins-Regular.ttf
          curl --fail --location 'https://fonts.gstatic.com/s/comfortaa/v47/1Pt_g8LJRfWJmhDAuUsSQamb1W0lwk4S4VrMPrQ.ttf' -o ~/.local/share/fonts/Comfortaa-Medium.ttf
          fc-cache -f
      - run: python scripts/build-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
