name: Telegram group reader
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-group-reader
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          git fetch origin tg-inbox --depth=1 2>/dev/null && git checkout -B tg-inbox FETCH_HEAD || git checkout --orphan tg-inbox
          git rm -rf . >/dev/null 2>&1 || true
          cat > reader.pem <<'CERT'
          -----BEGIN CERTIFICATE-----
