          -----END CERTIFICATE-----
          CERT
          cat > reader.py <<'PYCODE'
          import os, json, subprocess, sys, urllib.request, urllib.error, urllib.parse
          T = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          def tg(method, **params):
              q = urllib.parse.urlencode({k: (json.dumps(v) if isinstance(v, (list, dict)) else v) for k, v in params.items()})
              try:
                  with urllib.request.urlopen('https://api.telegram.org/bot' + T + '/' + method + ('?' + q if q else ''), timeout=30) as r:
                      d = json.load(r)
              except urllib.error.HTTPError as e:
                  print('telegram http error', e.code); sys.exit(0)
              except Exception:
                  print('transport error'); sys.exit(0)
              if not d.get('ok'):
                  print('telegram rejected', method); sys.exit(0)
              return d['result']
          if not T:
              print('missing secret'); sys.exit(0)
          wh = tg('getWebhookInfo')
          if wh.get('url'):
              print('webhook is set; reader stands down, nothing changed'); sys.exit(0)
          st = {}
          try: st = json.load(open('inbox/state.json'))
          except Exception: pass
          off = st.get('offset')
          args = dict(limit=100, timeout=0, allowed_updates=['message', 'edited_message', 'my_chat_member'])
          if off: args['offset'] = off
          ups = tg('getUpdates', **args)
          print('updates:', len(ups))
          if not ups: sys.exit(0)
          first, last = ups[0]['update_id'], ups[-1]['update_id']
          p = subprocess.run(['openssl', 'cms', '-encrypt', '-aes-256-cbc', '-outform', 'PEM', 'reader.pem'],
                             input=json.dumps(ups).encode(), capture_output=True)
          if p.returncode: print('encrypt failed'); sys.exit(1)
          os.makedirs('inbox', exist_ok=True)
          open('inbox/batch-%d-%d.cms' % (first, last), 'wb').write(p.stdout)
          json.dump({'offset': last + 1}, open('inbox/state.json', 'w'))
          print('stored batch', first, last)
          PYCODE
          python3 reader.py
          rm -f reader.py reader.pem
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inbox 2>/dev/null || true
          git diff --cached --quiet || { git commit -m inbox && git push origin tg-inbox; }
